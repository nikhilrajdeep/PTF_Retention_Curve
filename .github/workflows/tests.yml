name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt scikit-learn joblib pytest
      - name: NumPy/Numba engine == original PyTorch code (all 12 ensembles)
        run: pytest -q tests/
      - name: Smoke-test the app imports
        run: python -c "import ast; ast.parse(open('app.py').read())"
